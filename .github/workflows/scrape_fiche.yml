name: Murfy — Fiche Technique

on:
  schedule:
    # Toutes les 30 min de 7h à 18h heure de Paris (UTC+2 été = 5h-16h UTC)
    - cron: "0,30 5-16 * * 1-5"
  workflow_dispatch: {}

jobs:
  maj-fiche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]   # 6 shards = 6 IPs différentes
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Reconstituer le fichier credentials.json depuis le secret
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 -d > credentials.json

      - name: Lancer le script fiche technique (shard ${{ matrix.shard }})
        env:
          SHEET_ID_FICHE: ${{ secrets.SHEET_ID_FICHE }}
          SHARD_INDEX:    ${{ matrix.shard }}
          SHARD_COUNT:    "6"
          BATCH_LIMIT:    "10"
          DELAY_SECONDS:  "20"
        run: python sheet_fiche.py
