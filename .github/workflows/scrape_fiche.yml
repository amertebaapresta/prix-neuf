name: Murfy — Fiche Technique
on:
  workflow_dispatch: {}  # Déclenché uniquement via cron-job.org
jobs:
  maj-fiche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Reconstituer le fichier credentials.json depuis le secret
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 -d > credentials.json
      - name: Lancer le script fiche technique (shard ${{ matrix.shard }})
        env:
          SHEET_ID_FICHE:  ${{ secrets.SHEET_ID_FICHE }}
          SHARD_INDEX:     ${{ matrix.shard }}
          SHARD_COUNT:     "6"
          BATCH_LIMIT:     "10"
          DELAY_SECONDS:   "20"
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_ID:      ${{ secrets.CRONJOB_ID }}
        run: python sheet_fiche.py
