name: Murfy — Fiche Technique

on:
  schedule:
    # Toutes les 2h, 7h-19h heure de Paris (été = UTC+2, donc 5h-17h UTC)
    # Du lundi au vendredi
    - cron: "0 5,7,9,11,13,15,17 * * 1-5"
  workflow_dispatch: {}  # déclenchement manuel depuis GitHub ou cron-job.org

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false          # si un shard 403, les autres continuent
      matrix:
        shard: [0, 1, 2]        # 3 machines = 3 IP différentes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Reconstituer credentials.json
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 -d > credentials.json

      - name: Lancer le scraper (shard ${{ matrix.shard }})
        env:
          SHEET_ID:     ${{ secrets.SHEET_ID_FICHE }}
          SHARD_INDEX:  ${{ matrix.shard }}
          SHARD_COUNT:  "3"
          BATCH_LIMIT:  "5"
          DELAY_SECONDS: "20"
        run: python sheet_fiche.py
