name: Maj prix Export Superset

on:
  workflow_dispatch: {}

jobs:
  maj-prix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Reconstituer le fichier credentials.json depuis le secret
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 -d > credentials.json

      - name: Lancer le script de mise à jour des prix
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHARD_INDEX: 0
          SHARD_COUNT: 1
          BATCH_LIMIT: 30
          DELAY_SECONDS: 20
        run: python sheet_prix.py
